[pytest]
# The task 11 tests are the test suite under tasks/. Each task folder
# is a separate program with its own library.py, and the starter's
# tests fail with "not implemented" until they are written, so pytest
# runs the solution folder only. The topic files in testing/ are run
# on their own with python -m unittest (see README.md).
testpaths = tasks/11_testing/solution
